# Apache site for the silva-mentis container: public/ is the web root, nothing else is reachable.
<VirtualHost *:80>
    DocumentRoot /var/www/silva-mentis/public

    <Directory /var/www/silva-mentis/public>
        Options -Indexes
        # public/.htaccess sets MIME types and caching for static files.
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
